[project]
name = "factor-discovery-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xiang Zhenxu", email = "59477hhh@sjtu.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.94",
    "baostock>=0.9.3",
    "cvxpy>=1.9.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "tushare>=1.4.29",
]

[project.scripts]
factor-discovery-portfolio = "factor_discovery_portfolio:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
